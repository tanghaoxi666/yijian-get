<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 一键 Get</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen font-sans antialiased">
  <main class="auth-page">
    <!-- Logo 区 -->
    <div class="auth-logo-wrap">
      <div class="auth-logo-icon">
        <i data-lucide="zap"></i>
      </div>
      <h1 class="auth-title">欢迎回来</h1>
      <p class="auth-subtitle">登录「一键 Get」，开启高效之旅</p>
    </div>

    <!-- 登录卡片 -->
    <div class="auth-card">
      <form id="login-form" class="auth-form" onsubmit="return false;">
        <!-- 用户名/邮箱 -->
        <div class="form-group">
          <label class="form-label" for="login-username">用户名 / 邮箱</label>
          <div class="nm-input-wrap">
            <i data-lucide="user" class="nm-input-icon"></i>
            <input type="text" id="login-username" class="nm-input" placeholder="请输入用户名或邮箱" autocomplete="username">
          </div>
        </div>

        <!-- 密码 -->
        <div class="form-group">
          <label class="form-label" for="login-password">密码</label>
          <div class="nm-input-wrap">
            <i data-lucide="lock" class="nm-input-icon"></i>
            <input type="password" id="login-password" class="nm-input" placeholder="请输入密码" autocomplete="current-password">
            <button type="button" class="nm-input-toggle" data-toggle-password="login-password">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <!-- 记住我 + 忘记密码 -->
        <div class="form-options" style="display:flex;align-items:center;justify-content:space-between;margin-top:-4px;">
          <label class="nm-checkbox-wrap">
            <div class="nm-checkbox checked">
              <i data-lucide="check"></i>
            </div>
            <span class="nm-checkbox-label">记住我</span>
          </label>
          <a href="#" class="forgot-link" style="font-size:13px;color:var(--yj-primary);font-weight:500;">忘记密码？</a>
        </div>

        <!-- 登录按钮 -->
        <button type="submit" class="nm-btn nm-btn-primary">登 录</button>

        <!-- 分割线 -->
        <div class="nm-divider">
          <span class="nm-divider-text">或</span>
        </div>
      </form>

      <!-- 第三方登录 -->
      <div class="social-login">
        <button type="button" class="nm-social-btn social-wechat" title="微信登录" data-social-login="wechat">
          <i data-lucide="message-circle"></i>
        </button>
        <button type="button" class="nm-social-btn social-qq" title="QQ 登录" data-social-login="qq">
          <i data-lucide="octagon"></i>
        </button>
        <button type="button" class="nm-social-btn social-email" title="邮箱登录" data-social-login="email">
          <i data-lucide="mail"></i>
        </button>
      </div>

      <!-- 第三方登录弹窗 -->
      <div id="social-modal" class="modal-overlay hidden fixed inset-0 z-50 items-center justify-center p-4" style="background: rgba(44,62,80,0.5); backdrop-filter: blur(4px);">
        <div class="nm-raised-lg rounded-[var(--yj-radius-xl)] p-6 bg-[var(--yj-background)] w-full max-w-[380px] relative">
          <button class="absolute top-4 right-4 w-8 h-8 rounded-full nm-raised-sm flex items-center justify-center bg-[var(--yj-background)]" data-modal-close="social-modal"><i data-lucide="x" class="w-4 h-4 text-[var(--yj-foreground-muted)]"></i></button>
          <div id="social-modal-body"></div>
        </div>
      </div>

      <!-- 底部链接 -->
      <div class="auth-bottom-link">
        还没有账号？<a href="register.html">立即注册</a>
      </div>
    </div>

    <!-- 底部版权 -->
    <div class="auth-footer">
      &copy; 2026 一键 Get. All rights reserved.
    </div>
  </main>
  <script src="js/seed-data.js?v=8"></script>
  <script src="js/store.js?v=8"></script>
  <script src="js/app.js?v=8"></script>
</body>
</html>
