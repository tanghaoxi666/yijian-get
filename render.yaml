services:
  - type: web
    name: yijian-get
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: PORT
        value: "10000"
      - key: SITE_URL
        sync: false  # 部署后在 Render 面板填写你的域名
      - key: WECHAT_APP_ID
        sync: false
      - key: WECHAT_APP_SECRET
        sync: false
      - key: QQ_APP_ID
        sync: false
      - key: QQ_APP_SECRET
        sync: false
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
