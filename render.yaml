services:
  - type: web
    name: yijian-get
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: "production"
      - key: TURSO_DATABASE_URL
        value: "libsql://yijian-get-tanghaoxi666.aws-ca-central-1.turso.io"
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SITE_URL
        sync: false
      - key: WECHAT_APP_ID
        sync: false
      - key: WECHAT_APP_SECRET
        sync: false
      - key: QQ_APP_ID
        sync: false
      - key: QQ_APP_SECRET
        sync: false
